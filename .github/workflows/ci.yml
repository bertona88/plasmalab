name: Laboratory checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust and WASM binding generator
        run: |
          rustup show
          version=$(node scripts/wasm-bindgen-version.mjs)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: npm run build:wasm
      - run: npm run format:check
      - run: npm run check
      - run: npm run check:tests
      - run: npm run build
      - run: npm run test:wasm
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: test-results/
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned toolchain and targets
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked --target wasm32-unknown-unknown
      - run: npm ci
      - run: npm run check:contracts
